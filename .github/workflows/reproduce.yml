name: Reproduce analysis outputs

on:
  push:
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Reproduce and verify
        run: make reproduce PYTHON=python
      - name: Upload analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: fha-analysis-outputs
          path: |
            outputs/
            data/processed/*.csv
